<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- Animal cell model for the Part 1 labeling question. No labels on purpose: students drag them on. -->
  <defs>
    <radialGradient id="cyto" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff4ec"/><stop offset="1" stop-color="#fde0cf"/>
    </radialGradient>
    <radialGradient id="nuc" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#d9c8f2"/><stop offset="1" stop-color="#b49ae0"/>
    </radialGradient>
  </defs>
  <!-- cell membrane and cytoplasm -->
  <ellipse cx="300" cy="220" rx="275" ry="200" fill="url(#cyto)" stroke="#e08a5c" stroke-width="9"/>
  <!-- vacuole -->
  <ellipse cx="118" cy="205" rx="40" ry="31" fill="#cfe8fb" stroke="#5a9fd4" stroke-width="3"/>
  <!-- lysosome -->
  <circle cx="190" cy="118" r="21" fill="#f6d36b" stroke="#c89a18" stroke-width="3"/>
  <g fill="#c89a18"><circle cx="183" cy="112" r="2.6"/><circle cx="195" cy="110" r="2.6"/><circle cx="188" cy="124" r="2.6"/><circle cx="199" cy="122" r="2.6"/></g>
  <!-- rough endoplasmic reticulum, folded around the right side of the nucleus -->
  <g fill="none" stroke="#4fae8c" stroke-width="6" stroke-linecap="round">
    <path d="M368 140 C 400 160, 400 190, 380 205 C 360 220, 405 240, 385 262 C 372 276, 390 292, 372 300"/>
    <path d="M392 128 C 428 152, 428 192, 408 208 C 390 222, 432 244, 412 266 C 398 282, 418 300, 398 312"/>
    <path d="M416 120 C 455 146, 455 192, 434 210 C 418 224, 458 248, 438 270 C 426 284, 444 304, 424 318"/>
  </g>
  <g fill="#2f6f57">
    <circle cx="381" cy="150" r="3"/><circle cx="395" cy="176" r="3"/><circle cx="374" cy="232" r="3"/><circle cx="391" cy="248" r="3"/><circle cx="380" cy="285" r="3"/>
    <circle cx="410" cy="140" r="3"/><circle cx="423" cy="170" r="3"/><circle cx="418" cy="232" r="3"/><circle cx="420" cy="256" r="3"/><circle cx="405" cy="298" r="3"/>
    <circle cx="436" cy="134" r="3"/><circle cx="449" cy="172" r="3"/><circle cx="443" cy="236" r="3"/><circle cx="447" cy="262" r="3"/><circle cx="433" cy="300" r="3"/>
  </g>
  <!-- free ribosomes -->
  <g fill="#2f6f57">
    <circle cx="500" cy="232" r="4"/><circle cx="512" cy="246" r="4"/><circle cx="496" cy="256" r="4"/><circle cx="520" cy="224" r="4"/>
    <circle cx="250" cy="62" r="4"/><circle cx="262" cy="74" r="4"/><circle cx="240" cy="78" r="4"/>
  </g>
  <!-- nucleus with nuclear envelope and nucleolus -->
  <circle cx="285" cy="210" r="72" fill="url(#nuc)" stroke="#7a5bb5" stroke-width="5"/>
  <circle cx="285" cy="210" r="65" fill="none" stroke="#7a5bb5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="300" cy="200" r="22" fill="#6a4aa6"/>
  <path d="M245 235 q 10 -14 22 0 t 22 0" fill="none" stroke="#6a4aa6" stroke-width="2.5"/>
  <path d="M255 180 q 8 -10 16 0 t 16 0" fill="none" stroke="#6a4aa6" stroke-width="2.5"/>
  <!-- mitochondria -->
  <g transform="translate(482 132) rotate(-18)">
    <ellipse rx="48" ry="23" fill="#f59f8b" stroke="#c4553d" stroke-width="4"/>
    <path d="M-36 0 l8 -14 l8 26 l8 -26 l8 26 l8 -26 l8 26 l8 -26 l8 14" fill="none" stroke="#c4553d" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(150 308) rotate(24)">
    <ellipse rx="48" ry="23" fill="#f59f8b" stroke="#c4553d" stroke-width="4"/>
    <path d="M-36 0 l8 -14 l8 26 l8 -26 l8 26 l8 -26 l8 26 l8 -26 l8 14" fill="none" stroke="#c4553d" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Golgi apparatus: stacked flattened sacs with small vesicles -->
  <g fill="#9fd0e8" stroke="#3c86ab" stroke-width="3">
    <path d="M262 318 q 50 -26 100 0 q -50 -12 -100 0 z"/>
    <path d="M258 334 q 54 -26 108 0 q -54 -12 -108 0 z"/>
    <path d="M256 350 q 56 -26 112 0 q -56 -12 -112 0 z"/>
    <path d="M260 366 q 52 -24 104 0 q -52 -12 -104 0 z"/>
    <circle cx="378" cy="330" r="6"/><circle cx="386" cy="350" r="5"/><circle cx="246" cy="342" r="5"/>
  </g>
</svg>
